[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oboeru"
version = "0.2.0"
description = "Addictive terminal kanji quiz (TUI) on KANJIDIC2 data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "textual>=8.2.8",
  "pillow>=12",
]

[project.scripts]
oboeru = "oboeru.app:main"

[tool.hatch.build]
# The KANJIDIC2 database is built into the package before `uv build`
# (see .github/workflows/oboeru-release.yml); bundle it as package data.
artifacts = ["src/oboeru/kanjidic2.sqlite"]
